services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      API_HOST: 0.0.0.0
      DATABASE_URL: postgresql://dochub:dochub@db:5432/dochub
      VITE_HOST: 0.0.0.0
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dochub
      POSTGRES_USER: dochub
      POSTGRES_PASSWORD: dochub
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dochub -d dochub"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data: