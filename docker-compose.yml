services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        API_PORT: ${API_PORT:-3002}
    environment:
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT:-3002}
      DATABASE_URL: ${DATABASE_URL:-postgresql://dochub:dochub@db:5432/dochub}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?Set AUTH_TOKEN_SECRET in .env}
      VITE_HOST: 0.0.0.0
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dochub
      POSTGRES_USER: dochub
      POSTGRES_PASSWORD: dochub
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      - ./docker/postgres/migrations/002_medical_specialties.sql:/docker-entrypoint-initdb.d/002-medical_specialties.sql:ro
      - ./docker/postgres/migrations/003_specialty_access_frequency.sql:/docker-entrypoint-initdb.d/003_specialty_access_frequency.sql:ro
      - ./docker/postgres/migrations/004_questions.sql:/docker-entrypoint-initdb.d/004-questions.sql:ro
      - ./docker/postgres/migrations/005_answers.sql:/docker-entrypoint-initdb.d/005-answers.sql:ro
      - ./docker/postgres/migrations/006_user_role.sql:/docker-entrypoint-initdb.d/006-user-role.sql:ro
      - ./docker/postgres/migrations/007_auth_tokens.sql:/docker-entrypoint-initdb.d/007-auth_tokens.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dochub -d dochub"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data: